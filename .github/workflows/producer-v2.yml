name: Producer V2 preregistered dispatch
'on':
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: Frozen research execution commit SHA; required for the exact research branch
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: producer-v2-run001
  cancel-in-progress: false
jobs:
  trusted:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/trusted-producer-v2.yml
    with:
      source_sha: ${{ github.sha }}
      expected_execution_sha: ${{ inputs.expected_execution_sha }}
    secrets:
      EVIDENCEFLOW3D_AGE_IDENTITY: ${{ secrets.EVIDENCEFLOW3D_AGE_IDENTITY }}
