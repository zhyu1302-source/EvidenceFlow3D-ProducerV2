name: Producer V2 preregistered dispatch
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: producer-v2-run001
  cancel-in-progress: false
jobs:
  trusted:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: zhyu1302-source/EvidenceFlow3D-ProducerV2/.github/workflows/trusted-producer-v2.yml@e0bda09227cfa9ac0c76284f3d386922c44646ba
    with:
      source_sha: ${{ github.sha }}
    secrets:
      EVIDENCEFLOW3D_AGE_IDENTITY: ${{ secrets.EVIDENCEFLOW3D_AGE_IDENTITY }}
