name: Trusted encrypted Producer V2
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      expected_execution_sha:
        type: string
        required: false
        default: ''
    secrets:
      EVIDENCEFLOW3D_AGE_IDENTITY:
        required: true
permissions:
  contents: read
jobs:
  producer:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.run_attempt == '1' &&
          github.repository_id == '1440507862' &&
          (github.ref == 'refs/heads/main' ||
           (github.repository == 'zhyu1302-source/EvidenceFlow3D-ProducerV2' &&
            github.ref == 'refs/heads/research/n50-003-producer-exec-v1' &&
            inputs.expected_execution_sha == github.sha &&
            inputs.source_sha == github.sha)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exact-ref execution authorization gate
        env:
          EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
          CHECKOUT_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'IDENTITY_GATE'
          const crypto = require('node:crypto');
          function gate(env, expected, authorizationSHA, api) {
           function check(ok,what){if(!ok)throw new Error('Execution identity rejected: '+what);}
           function canonical(x){if(Array.isArray(x))return '['+x.map(canonical).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';return JSON.stringify(x);}
           function content(path){
            const rec=api('contents/'+path+'?ref='+env.GITHUB_SHA);check(rec.encoding==='base64'&&typeof rec.content==='string','content encoding');const bytes=Buffer.from(rec.content,'base64');
            const blob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');check(blob===rec.sha,'Git blob bytes');
            return {record:rec,bytes,sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
           }
           check(env.GITHUB_EVENT_NAME==='workflow_dispatch','event');check(env.GITHUB_REPOSITORY===expected.repository,'repository');check(env.GITHUB_REPOSITORY_ID===expected.repository_id,'repository ID');check(env.GITHUB_RUN_ATTEMPT==='1','attempt');
           // Preserve original main path. All research-specific restrictions remain below.
           if(env.GITHUB_REF==='refs/heads/main')return {accepted:true,path:'ORIGINAL_MAIN_PATH'};
           check(env.GITHUB_REF===expected.execution_ref,'exact research ref');check(/^[0-9a-f]{40}$/.test(env.EXPECTED_EXECUTION_SHA||''),'external execution SHA');check(env.GITHUB_SHA===env.EXPECTED_EXECUTION_SHA,'expected execution SHA mismatch');check(env.CHECKOUT_SOURCE_SHA===env.GITHUB_SHA,'source SHA');
           check(env.RUNNER_ENVIRONMENT==='github-hosted'&&env.RUNNER_OS==='Linux'&&env.RUNNER_ARCH==='X64','hosted runner identity');
           const ref=api('git/ref/heads/'+expected.execution_ref.slice('refs/heads/'.length));check(ref.object.sha===env.GITHUB_SHA,'current remote research branch SHA');
           const commit=api('git/commits/'+env.GITHUB_SHA);check(commit.parents.length===1&&commit.parents[0].sha===expected.required_parent_execution_commit,'exact single direct parent');
           const auth=content('EXECUTION_AUTHORIZATION.json');check(auth.sha256===authorizationSHA,'authorization raw SHA256');const actual=JSON.parse(auth.bytes.toString('utf8'));check(canonical(actual)===canonical(expected),'authorization fields');
           const current=content('N50_003_PRE_REGISTRATION.json');check(current.record.sha===expected.canonical_prereg_git_blob,'canonical prereg Git blob');check(current.sha256===expected.canonical_prereg_raw_sha256,'canonical prereg raw SHA256');const pre=JSON.parse(current.bytes.toString('utf8'));
           check(pre.version==='PROSPECTIVE_TARGET_SELECTION_V2_N50_003_RUN001'&&pre.source_sample_id==='n50_003'&&pre.source_sample_id===expected.source_sample_id,'source object/version');check(pre.repository===expected.repository&&String(pre.repository_numeric_ID)===expected.repository_id,'prereg repository');check(pre.execution_ref===expected.execution_ref&&pre.formal_execution_limit===1,'prereg exact ref/execution limit');
           check(pre.release_tag===expected.release_tag,'release tag');check(pre.parent_manifest_SHA256===expected.parent_manifest_SHA256,'parent manifest');check(pre.code_manifest_SHA256===expected.code_manifest_SHA256,'code manifest');check(pre.config_SHA256===expected.config_SHA256&&pre.requirements_lock_SHA256===expected.requirements_lock_SHA256,'config/dependency identities');check(pre.custom_predicate_schema_SHA256===expected.custom_predicate_schema_SHA256,'predicate schema');check(pre.workflow_base_commit===expected.required_parent_execution_commit,'preregistered base commit');
           check(canonical(pre.capture_manifest_hashes)===canonical(expected.capture_manifest_hashes),'fresh capture/query/helper/camera identities');
           check(pre.old_matching_membership_not_material===true&&pre.old_target_membership_not_material===true&&pre.selection_matching_algorithm_changed===false,'independent replication policy');check(pre.producer_capture_origin==='LOCAL_SPARD3D_FORMAL_NATIVE_ONLY'&&pre.MODEL_CAPTURE_GITHUB_HOSTED==='NO'&&pre.MODEL_CAPTURE_ATTESTED_BY_PRODUCER_WORKFLOW==='NO','model capture origin');
           check(pre.matching_protocol.caliper_SD===0.5&&pre.matching_protocol.acceptance_MAX_PRIMARY_ABS_SMD===0.25&&pre.matching_protocol.preferred_MAX_PRIMARY_ABS_SMD===0.1,'frozen matching thresholds');
           check(Array.isArray(pre.bundles)&&pre.bundles.length===2,'bundle count');
           for(const role of ['producer_code_bundle','producer_input_bundle']){const matches=pre.bundles.filter(x=>x.role===role);check(matches.length===1,'unique bundle role');const b=matches[0];check(b.ciphertext_filename===role+'.tar.zst.age'&&b.ciphertext_SHA256===expected.ciphertext_sha256[role]&&b.ciphertext_bytes===expected.ciphertext_sizes[role],'ciphertext identity '+role);check(b.plaintext_archive_SHA256===expected.plaintext_archive_sha256[role],'plaintext identity '+role);}
           // Read-only durable single-dispatch guard; concurrency serializes this branch's jobs.
           const runs=api('actions/runs?event=workflow_dispatch&branch='+encodeURIComponent(expected.execution_ref.slice('refs/heads/'.length))+'&per_page=100');check(Array.isArray(runs.workflow_runs),'dispatch history');check(runs.total_count<=100,'dispatch history pagination must be fully enumerable');
           const others=runs.workflow_runs.filter(x=>String(x.id)!==String(env.GITHUB_RUN_ID)&&x.event==='workflow_dispatch'&&x.head_branch===expected.execution_ref.slice('refs/heads/'.length));check(others.length===0,'second dispatch lock');
           return {accepted:true,path:'EXACT_N50_003_RESEARCH_IDENTITY',governance:expected.independent_human_review,publication_permission:'MUST_BE_SEPARATELY_AUTHORIZED; this identity gate does not grant user permission'};
          }

          const {execFileSync}=require('node:child_process');
          const expected={"CAPTURE_ORIGIN":"LOCAL_SPARD3D_FORMAL_NATIVE_ONLY","MODEL_CAPTURE_ATTESTED_BY_PRODUCER_WORKFLOW":"NO","MODEL_CAPTURE_GITHUB_HOSTED":"NO","authority_scope":"CANDIDATE_IDENTITY_BINDING_ONLY; separate user authorization required before remote publication/execution; no n50_002 waiver reused","authorization_version":"N50_003_EXACT_REF_EXECUTION_CANDIDATE_V1","base_successful_run_id":41206119906,"canonical_prereg_git_blob":"ca202a2e1f914f37a9c38e87c6565152833bac83","canonical_prereg_raw_sha256":"0d3a1e605477d257b4a2dea90e2abb65c8d4e9a058332b37182231323d377879","canonical_preregistration_path":"N50_003_PRE_REGISTRATION.json","capture_manifest_hashes":{"CSR_SHA256":{"ABSENT":"f1958f3e38bf1e6c69db41a12c0cdeb5d4c559cc544210ccc07529513a5f9160","FULL_LEFT":"e394bed06c10208e8fddb7c4c878de4e3f74687f5a30e36079c57e4cad28accc"},"ROI_SHA256":{"body_ROI":"8b1fe31759cdaef55ab93d9f777993740cd4f21f6b2994298a9f83ad5348fd34","target_ROI":"99e42734753473392488bfa2648e296efd8081cbb0e42926b6d255f916d6267f"},"camera_contract_SHA256":"4c9b4eba58d9e27637ec6714ac5a6f8a16d5eb86f8eb13b64dd1cf45c0039bd0","camera_mapping_provenance_SHA256":"ca766aa53b030805fc6eb12ed93e646b02ee111f7060be8f3b8ffad980c26188","formal_pair_manifest_raw_SHA256":"0dd3db5b0f4e0398d9baed45122b08c63e6a9995d3f02198b6f4af9c35f476df","geometry_provenance_SHA256":{"ABSENT":"64f6060c348292c8f5ae2b080a2aef2120e22c866754fa99a0670705028dfe78","FULL_LEFT":"64f6060c348292c8f5ae2b080a2aef2120e22c866754fa99a0670705028dfe78"},"helper_contract_SHA256":{"ABSENT":"34d05153a4ae7cfd5b85db5d7a09db5a6e878cf05b19077a2baafb9fa67d420b","FULL_LEFT":"34d05153a4ae7cfd5b85db5d7a09db5a6e878cf05b19077a2baafb9fa67d420b"},"helper_resource_SHA256":"1f4be37efc604d28d55a1a78c2aabefeeab7e63149f541aa45f9dd858ee35bb9","noise_manifest_raw_SHA256":"a719d6668128935f918af23d9547a20d140da24127508dc69faa23f19143ead6","pair_identity_manifest_raw_SHA256":"555386e74c17be5b1f1cda31a198ff8c0ab450f24c3379b45ec0e6b0cfa059fe","query_positions_raw_SHA256":"6c5500286b203884be0208e8d572ccf220d5d66b2bfed4c117220beb4bb68405","session_manifest_raw_SHA256":{"ABSENT":"06446673893f716273ce4b8af60bf29970137ba83bd1b48466d74b9f9cfc1cb8","FULL_LEFT":"f196e5ddee2cc2cfb05686b8ff284896a31990989d558d901029e221fb471dce"}},"ciphertext_sha256":{"producer_code_bundle":"f0833d13e64a5d7edcb6183fe96910bc129127e5c7ff77099916af4809ff650d","producer_input_bundle":"0a7063e67317b4d5ad235a6d0d526dee773a73cc810beca5a19d1ce4cfc28aa6"},"ciphertext_sizes":{"producer_code_bundle":62680382,"producer_input_bundle":641112576},"code_manifest_SHA256":"99e8b430b1d370123540fc95e350f6c16fcaf2191c17cf98ca81449783c3f16c","config_SHA256":"957ea1dada9146099d461d7f8bad604fc3c307165b630da90c12f8183c869752","custom_predicate_schema_SHA256":"fe368e1a80be4017a36b7bda3a7ec4a8915eda290e1343da3282ba6b0946cb72","dispatch_limit":1,"execution_commit_binding":"EXTERNALLY_FROZEN_EXECUTION_SHA; expected_execution_sha=github.sha=source_sha","execution_ref":"refs/heads/research/n50-003-producer-exec-v1","formal_Producer_execution_authorized":false,"formal_pair_ID":"n50_003_native_v1_1_6c49c5bd-0845-47b0-acde-89714ff285e5","fresh_capture_session_ID":"n50_003_native_v1_1_6c49c5bd-0845-47b0-acde-89714ff285e5","independent_human_review":"NOT_OBTAINED; no APPROVED claim","parent_manifest_SHA256":"3501f1880e7629318604793ba7694482d406e1ef82c039ee56014ec82645fc79","plaintext_archive_sha256":{"producer_code_bundle":"a786a555254a329745504be923555aa6bb2863f8a705b76e88196f62bba35094","producer_input_bundle":"4e8555605866f6b5c77dd43ebf037e838f261e50dd632276e288c07674f3e78e"},"preparation_authorized":true,"release_tag":"producer-v2-n50-003-run001","remote_publication_authorized":false,"repository":"zhyu1302-source/EvidenceFlow3D-ProducerV2","repository_id":"1440507862","required_parent_execution_commit":"0405f4c185997df818873427f82bc9eb76186d9b","requirements_lock_SHA256":"5d2ad078186d6db8d0d6dd2d9fd6e8f66260b580fee25560fd60c55bc5aa4b9e","source_sample_id":"n50_003","user_authorized_research_exception":false};
          const authorizationSHA='0246b99466efef71ca1ccdf83850f86bbd6a2d7db841bf292aa9de9ce3089ffc';
          function api(path){return JSON.parse(execFileSync('gh',['api','repos/'+expected.repository+'/'+path],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));}
          const result=gate(process.env,expected,authorizationSHA,api);
          console.log(result.path+' accepted before checkout, release download, decrypt or Python execution.');
          IDENTITY_GATE
      - name: Checkout exact preregistration commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fixed execution identity and obtain encrypted inputs
        env:
          AGE_IDENTITY: ${{ secrets.EVIDENCEFLOW3D_AGE_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'zhyu1302-source/EvidenceFlow3D-ProducerV2'
          test "$GITHUB_REPOSITORY_ID" = '1440507862'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          mkdir -p "$RUNNER_TEMP/secure/code" "$RUNNER_TEMP/secure/input" "$RUNNER_TEMP/encrypted"
          printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/secure/identity.agekey"
          curl -fsSL 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz' -o "$RUNNER_TEMP/age.tar.gz"
          printf '%s  %s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          release_tag=$(jq -er .release_tag N50_003_PRE_REGISTRATION.json)
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern '*.age' --dir "$RUNNER_TEMP/encrypted"
          for role in producer_code_bundle producer_input_bundle; do
            name="$role.tar.zst.age"
            cipher=$(jq -r --arg role "$role" '.bundles[]|select(.role==$role)|.ciphertext_SHA256' N50_003_PRE_REGISTRATION.json)
            plain=$(jq -r --arg role "$role" '.bundles[]|select(.role==$role)|.plaintext_archive_SHA256' N50_003_PRE_REGISTRATION.json)
            printf '%s  %s\n' "$cipher" "$RUNNER_TEMP/encrypted/$name" | sha256sum --check --status
            "$RUNNER_TEMP/age/age" -d -i "$RUNNER_TEMP/secure/identity.agekey" -o "$RUNNER_TEMP/secure/$role.tar.zst" "$RUNNER_TEMP/encrypted/$name"
            printf '%s  %s\n' "$plain" "$RUNNER_TEMP/secure/$role.tar.zst" | sha256sum --check --status
          done
          tar --zstd -xf "$RUNNER_TEMP/secure/producer_code_bundle.tar.zst" -C "$RUNNER_TEMP/secure/code"
          tar --zstd -xf "$RUNNER_TEMP/secure/producer_input_bundle.tar.zst" -C "$RUNNER_TEMP/secure/input"
          printf '%s  %s\n' "$(jq -r .code_manifest_SHA256 N50_003_PRE_REGISTRATION.json)" "$RUNNER_TEMP/secure/code/PRODUCER_V2_CODE_MANIFEST.json" | sha256sum --check --status
          printf '%s  %s\n' "$(jq -r .config_SHA256 N50_003_PRE_REGISTRATION.json)" "$RUNNER_TEMP/secure/code/PRODUCER_V2_CONFIG.json" | sha256sum --check --status
          printf '%s  %s\n' "$(jq -r .parent_manifest_SHA256 N50_003_PRE_REGISTRATION.json)" "$RUNNER_TEMP/secure/input/PRODUCER_V2_PARENT_MANIFEST.json" | sha256sum --check --status
      - name: Install exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.14'
          architecture: x64
      - name: Install hash-locked offline CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$RUNNER_TEMP/secure/code/wheels" --require-hashes -r "$RUNNER_TEMP/secure/code/requirements.lock" > "$RUNNER_TEMP/secure/dependencies.log" 2>&1 || { echo 'Dependency verification failed; no producer execution'; exit 1; }
      - name: Verify all parent and code identities
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/secure/code/prospective_verify_inputs.py" --input "$RUNNER_TEMP/secure/input" --code "$RUNNER_TEMP/secure/code" --preregistration "$GITHUB_WORKSPACE/N50_003_PRE_REGISTRATION.json" > "$RUNNER_TEMP/secure/preflight.log" 2>&1 || { echo 'Parent/code verification failed; no producer execution'; exit 1; }
      - name: Synthetic deterministic unit fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/secure/code"
          python -B -m unittest prospective_v2_synthetic_tests > "$RUNNER_TEMP/secure/fixtures.log" 2>&1 || { echo 'Synthetic fixtures failed; no producer execution'; exit 1; }
      - name: Execute the sole prospective CPU producer
        id: produce
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/secure/PRODUCER_INVOKED"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/secure/PRODUCER_INVOKED"
          python -B "$RUNNER_TEMP/secure/code/prospective_producer_v2.py" --input "$RUNNER_TEMP/secure/input" --code "$RUNNER_TEMP/secure/code" --output "$RUNNER_TEMP/secure/results" > "$RUNNER_TEMP/secure/producer.log" 2>&1 || { echo 'Producer failed; outputs not attested'; exit 1; }
      - name: Package actual new outputs and custom research predicate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/secure/code/prospective_archive_and_predicate.py" --results "$RUNNER_TEMP/secure/results" --input "$RUNNER_TEMP/secure/input" --code "$RUNNER_TEMP/secure/code" --preregistration "$GITHUB_WORKSPACE/N50_003_PRE_REGISTRATION.json" --archive "$RUNNER_TEMP/secure/ProducerV2-output.tar.zst" --predicate "$RUNNER_TEMP/secure/research-predicate.json" > "$RUNNER_TEMP/secure/package.log" 2>&1 || { echo 'Packaging failed; no attestations'; exit 1; }
      - name: Attest default SLSA build provenance
        id: slsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ProducerV2-output.tar.zst
          subject-digest: ${{ steps.package.outputs.digest }}
      - name: Attest custom research provenance for the same plaintext subject
        id: research
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ProducerV2-output.tar.zst
          subject-digest: ${{ steps.package.outputs.digest }}
          predicate-type: https://github.com/zhyu1302-source/EvidenceFlow3D-ProducerV2/attestations/evidenceflow3d-target-selection/v2
          predicate-path: ${{ steps.package.outputs.predicate }}
      - name: Encrypt outputs and nonpublic execution logs
        shell: bash
        run: |
          set -euo pipefail
          recipient=$(jq -r .age_public_recipient N50_003_PRE_REGISTRATION.json)
          "$RUNNER_TEMP/age/age" -r "$recipient" -o "$RUNNER_TEMP/encrypted/ProducerV2-output.tar.zst.age" "$RUNNER_TEMP/secure/ProducerV2-output.tar.zst"
          tar --zstd -cf "$RUNNER_TEMP/secure/execution-logs.tar.zst" -C "$RUNNER_TEMP/secure" dependencies.log preflight.log fixtures.log producer.log package.log
          "$RUNNER_TEMP/age/age" -r "$recipient" -o "$RUNNER_TEMP/encrypted/execution-logs.tar.zst.age" "$RUNNER_TEMP/secure/execution-logs.tar.zst"
          printf '%s  %s\n' '${{ steps.package.outputs.digest }}' 'plaintext subject' > "$RUNNER_TEMP/encrypted/SUBJECT_DIGEST.txt"
          sha256sum "$RUNNER_TEMP/encrypted/ProducerV2-output.tar.zst.age" > "$RUNNER_TEMP/encrypted/ENCRYPTED_OUTPUT_SHA256.txt"
      - name: Upload ciphertext outputs only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ProducerV2-encrypted-results
          path: |
            ${{ runner.temp }}/encrypted/ProducerV2-output.tar.zst.age
            ${{ runner.temp }}/encrypted/execution-logs.tar.zst.age
            ${{ runner.temp }}/encrypted/SUBJECT_DIGEST.txt
            ${{ runner.temp }}/encrypted/ENCRYPTED_OUTPUT_SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failures as ciphertext only, excluding private identity
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$RUNNER_TEMP/age/age" ] && [ -f N50_003_PRE_REGISTRATION.json ]; then
            items=()
            for n in dependencies.log preflight.log fixtures.log producer.log package.log results; do
              if [ -e "$RUNNER_TEMP/secure/$n" ]; then items+=("$n"); fi
            done
            if [ "${#items[@]}" -gt 0 ]; then
              mkdir -p "$RUNNER_TEMP/encrypted"
              tar --zstd -cf "$RUNNER_TEMP/failure-logs.tar.zst" -C "$RUNNER_TEMP/secure" "${items[@]}"
              "$RUNNER_TEMP/age/age" -r "$(jq -r .age_public_recipient N50_003_PRE_REGISTRATION.json)" -o "$RUNNER_TEMP/encrypted/failure-logs.tar.zst.age" "$RUNNER_TEMP/failure-logs.tar.zst"
            fi
          fi
      - name: Upload failure ciphertext when present
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ProducerV2-encrypted-failure-records
          path: ${{ runner.temp }}/encrypted/failure-logs.tar.zst.age
          if-no-files-found: warn
          retention-days: 30
      - name: Clean ephemeral plaintext and private identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_TEMP/secure" in /home/runner/work/_temp/secure) rm -rf -- "$RUNNER_TEMP/secure" ;; *) echo 'Hosted runner will reclaim temporary files';; esac
